<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>帮得签证 · 产品目录</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif;
  background: #f0f2f5;
  color: #222;
  min-height: 100vh;
}
.header {
  background: linear-gradient(135deg, #0d1e44 0%, #1a3a6b 100%);
  padding: 24px 16px 20px;
  color: #fff;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header h1 { font-size: 22px; font-weight: 700; letter-spacing: 2px; }
.header .sub { font-size: 13px; color: #8ab4f8; margin-top: 4px; }
.search-bar {
  margin: 12px 16px 0;
  position: relative;
}
.search-bar input {
  width: 100%;
  padding: 10px 14px 10px 36px;
  border: none;
  border-radius: 8px;
  background: rgba(255,255,255,0.15);
  color: #fff;
  font-size: 14px;
  outline: none;
}
.search-bar input::placeholder { color: rgba(255,255,255,0.5); }
.search-bar .icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: rgba(255,255,255,0.5);
  font-size: 16px;
}

.continent-nav {
  display: flex;
  overflow-x: auto;
  padding: 12px 16px;
  gap: 8px;
  background: #fff;
  border-bottom: 1px solid #e8eaef;
  position: sticky;
  top: 100px;
  z-index: 99;
}
.continent-nav::-webkit-scrollbar { display: none; }
.continent-tab {
  flex-shrink: 0;
  padding: 6px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  background: #f0f2f5;
  color: #666;
  border: none;
  cursor: pointer;
  transition: all .2s;
}
.continent-tab.active {
  background: #0d1e44;
  color: #fff;
}
.continent-tab .count {
  font-size: 11px;
  opacity: .7;
  margin-left: 2px;
}

.content { padding: 12px 16px 80px; max-width: 640px; margin: 0 auto; }

.continent-section { display: none; }
.continent-section.active { display: block; }

.country-card {
  background: #fff;
  border-radius: 12px;
  margin-bottom: 10px;
  overflow: hidden;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.country-header {
  display: flex;
  align-items: center;
  padding: 14px 16px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background .15s;
}
.country-header:active { background: #f8f9fb; }
.country-flag { font-size: 24px; margin-right: 12px; }
.country-name { font-size: 16px; font-weight: 600; color: #1a2a3a; flex: 1; }
.country-count { font-size: 12px; color: #999; margin-right: 8px; }
.country-arrow {
  font-size: 14px; color: #ccc;
  transition: transform .25s ease;
}
.country-card.expanded .country-arrow { transform: rotate(180deg); }

.visa-list { display: none; padding: 0 16px 14px; }
.country-card.expanded .visa-list { display: block; }

.visa-item {
  display: flex;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid #f0f2f5;
  gap: 8px;
}
.visa-item:last-child { border-bottom: none; }
.visa-type {
  flex: 1;
  font-size: 14px;
  color: #444;
}
.visa-price {
  font-size: 14px;
  font-weight: 600;
  color: #dab93c;
  min-width: 50px;
  text-align: right;
}
.visa-dl {
  font-size: 12px;
  color: #07c;
  text-decoration: none;
  padding: 4px 10px;
  border: 1px solid #07c;
  border-radius: 6px;
  white-space: nowrap;
}
.visa-dl:active { background: #07c; color: #fff; }

.no-result {
  text-align: center;
  padding: 40px 16px;
  color: #999;
  font-size: 14px;
}

.edit-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(8px);
  padding: 8px 16px;
  display: flex;
  gap: 8px;
  border-top: 1px solid #e8eaef;
  z-index: 200;
}
.edit-bar button {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.btn-edit { background: #0d1e44; color: #fff; }
.btn-edit:active { opacity: .85; }
.btn-save { background: #34a878; color: #fff; display: none; }
.btn-cancel { background: #e8eaef; color: #666; display: none; }

/* Edit mode */
.visa-item.edit .visa-price {
  background: #fff8e6;
  border: none;
  border-radius: 4px;
  padding: 4px 8px;
  font-size: 14px;
  width: 80px;
  text-align: center;
  outline: 2px solid #dab93c;
}
.visa-item.edit .visa-price:focus {
  outline-color: #0d1e44;
}

.footer {
  text-align: center;
  padding: 16px;
  font-size: 12px;
  color: #aaa;
}
</style>
</head>

  <div class="search-bar">
    <span class="icon">🔍</span>

  </div>
</div>

<div class="continent-nav" id="continentNav"></div>

<div class="content" id="content"></div>

<div class="edit-bar" id="editBar">
  <button class="btn-edit" id="btnEdit" onclick="toggleEdit()">✏️ 编辑价格</button>
  <button class="btn-save" id="btnSave" onclick="savePrices()">💾 保存价格</button>
  <button class="btn-cancel" id="btnCancel" onclick="cancelEdit()">取消</button>
</div>

<div class="footer">
  <p>帮得签证 · 专业签证服务</p>
  <p style="margin-top:4px;font-size:11px;">如需办理签证，请联系客服获取最新报价</p>

const CONTINENT_ICONS = {"欧洲":"🌍","美洲":"🌎","亚洲":"🌏","大洋洲":"🌊","非洲":"🌍"};

let editing = false;
let backupPrices = {};

function init() {
  const nav = document.getElementById("continentNav");
  const content = document.getElementById("content");
  
  // Build nav tabs
  CONTINENT_ORDER.forEach((cont, i) => {
    const countries = PRODUCT_DATA[cont] || [];
    const btn = document.createElement("button");
    btn.className = "continent-tab" + (i === 0 ? " active" : "");
    btn.textContent = CONTINENT_ICONS[cont] + " " + cont;
    const span = document.createElement("span");
    span.className = "count";
    span.textContent = "(" + countries.length + ")";
    btn.appendChild(span);
    btn.onclick = () => switchContinent(cont);
    nav.appendChild(btn);
  });
  
  // Build sections
  CONTINENT_ORDER.forEach((cont, i) => {
    const section = document.createElement("div");
    section.className = "continent-section" + (i === 0 ? " active" : "");
    section.id = "section-" + cont;
    
    const countries = PRODUCT_DATA[cont] || [];
    countries.forEach(c => {
      section.appendChild(createCountryCard(c));
    });
    
    content.appendChild(section);
  });
}

function createCountryCard(c) {
  const card = document.createElement("div");
  card.className = "country-card";
  card.id = "card-" + c.name;
  
  const flag = FLAGS[c.name] || "🌐";
  
  const header = document.createElement("div");
  header.className = "country-header";
  header.onclick = () => {
    card.classList.toggle("expanded");
  };
  header.innerHTML = `
    <span class="country-flag">${flag}</span>
    <span class="country-name">${c.name}</span>
    <span class="country-count">${c.types.length}种</span>
    <span class="country-arrow">▼</span>
  `;
  card.appendChild(header);
  
  const list = document.createElement("div");
  list.className = "visa-list";
  
  c.types.forEach(type => {
    const price = c.prices[type] || "待询";
    const item = document.createElement("div");
    item.className = "visa-item";
    item.id = "item-" + c.name + "-" + type;
    item.innerHTML = `
      <span class="visa-type">${type}</span>
      <span class="visa-price" id="price-${c.name}-${type}">${price}</span>
      <a class="visa-dl" href="#">📄 材料</a>
    `;
    list.appendChild(item);
  });
  
  card.appendChild(list);
  return card;
}

function switchContinent(cont) {
  document.querySelectorAll(".continent-tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".continent-section").forEach(s => s.classList.remove("active"));
  document.querySelectorAll(".continent-tab").forEach(t => {
    if (t.textContent.includes(cont)) t.classList.add("active");
  });
  document.getElementById("section-" + cont).classList.add("active");
}

function filterProducts() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  let totalVisible = 0;
  
  document.querySelectorAll(".country-card").forEach(card => {
    const name = card.querySelector(".country-name").textContent.toLowerCase();
    const types = Array.from(card.querySelectorAll(".visa-type")).map(el => el.textContent.toLowerCase());
    const match = !q || name.includes(q) || types.some(t => t.includes(q));
    card.style.display = match ? "" : "none";
    if (match) totalVisible++;
  });
  
  document.querySelectorAll(".continent-section").forEach(section => {
    const visible = Array.from(section.querySelectorAll(".country-card")).filter(c => c.style.display !== "none").length;
    section.style.display = visible > 0 ? "" : "none";
  });
}

function toggleEdit() {
  editing = !editing;
  backupPrices = {};
  
  document.querySelectorAll(".visa-item").forEach(item => {
    const priceEl = item.querySelector(".visa-price");
    const type = priceEl.id.replace("price-", "");
    const [country, ...typeParts] = type.split("-");
    const visaType = typeParts.join("-");
    
    backupPrices[priceEl.id] = priceEl.textContent;
    
    if (editing) {
      item.classList.add("edit");
      const input = document.createElement("input");
      input.type = "text";
      input.className = "visa-price";
      input.value = priceEl.textContent;
      input.id = priceEl.id;
      input.onclick = e => e.stopPropagation();
      priceEl.replaceWith(input);
    }
  });
  
  document.getElementById("btnEdit").style.display = editing ? "none" : "";
  document.getElementById("btnSave").style.display = editing ? "" : "none";
  document.getElementById("btnCancel").style.display = editing ? "" : "none";
}

function savePrices() {
  document.querySelectorAll(".visa-item.edit input").forEach(input => {
    const id = input.id;
    const span = document.createElement("span");
    span.className = "visa-price";
    span.id = id;
    span.textContent = input.value;
    input.replaceWith(span);
    
    // Update data
    const type = id.replace("price-", "");
    const parts = type.split("-");
    const country = parts[0];
    const visaType = parts.slice(1).join("-");
    
    for (const cont of CONTINENT_ORDER) {
      const countries = PRODUCT_DATA[cont] || [];
      for (const c of countries) {
        if (c.name === country && c.prices) {
          c.prices[visaType] = input.value;
        }
      }
    }
  });
  
  editing = false;
  document.getElementById("btnEdit").style.display = "";
  document.getElementById("btnSave").style.display = "none";
  document.getElementById("btnCancel").style.display = "none";
  
  alert("✅ 价格已保存！刷新页面后数据保留。（如需持久化，请联系技术人员导出数据）");
}

function cancelEdit() {
  document.querySelectorAll(".visa-item.edit input").forEach(input => {
    const span = document.createElement("span");
    span.className = "visa-price";
    span.id = input.id;
    span.textContent = backupPrices[input.id] || "待询";
    input.replaceWith(span);
  });
  
  editing = false;
  document.getElementById("btnEdit").style.display = "";
  document.getElementById("btnSave").style.display = "none";
  document.getElementById("btnCancel").style.display = "none";
}

init();
</script>
