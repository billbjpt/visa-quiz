<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>邦德旅行 · 管理后台</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif;
  background: #0d1e44;
  color: #222;
  min-height: 100vh;
}

/* ========== TOP BAR ========== */
.top-bar {
  background: #0a1530;
  padding: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: #fff;
  position: sticky;
  top: 0;
  z-index: 100;
}
.top-bar h1 { font-size: 18px; font-weight: 700; }
.top-bar .admin-badge {
  font-size: 11px;
  background: #ffd866;
  color: #0d1e44;
  padding: 2px 10px;
  border-radius: 12px;
  font-weight: 700;
}
.top-actions {
  display: flex;
  gap: 6px;
}
.top-actions a {
  font-size: 12px;
  color: #8ab4f8;
  text-decoration: none;
  padding: 4px 10px;
  border: 1px solid #8ab4f8;
  border-radius: 6px;
}
.top-actions a:active { background: #8ab4f8; color: #fff; }

/* ========== NOTICE EDITOR ========== */
.notice-editor {
  margin: 12px 16px;
  background: rgba(255,215,0,0.08);
  border: 1px solid rgba(255,215,0,0.2);
  border-radius: 10px;
  padding: 12px;
}
.notice-editor label {
  font-size: 13px;
  color: #ffd866;
  font-weight: 600;
  display: block;
  margin-bottom: 6px;
}
.notice-editor textarea {
  width: 100%;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 6px;
  color: #fff;
  padding: 8px;
  font-size: 13px;
  resize: vertical;
  min-height: 50px;
  outline: none;
}
.notice-editor textarea:focus { border-color: #ffd866; }
.notice-editor button {
  margin-top: 6px;
  padding: 6px 16px;
  background: #ffd866;
  color: #0d1e44;
  border: none;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}

/* ========== PANEL ========== */
.panel {
  margin: 0 16px 12px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.panel button {
  padding: 8px 14px;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  flex: 1;
  min-width: 70px;
}
.btn-add { background: #34a878; color: #fff; }
.btn-edit { background: #0d1e44; color: #fff; border: 1px solid rgba(255,255,255,0.2) !important; }
.btn-save-all { background: #ffd866; color: #0d1e44; }
.btn-export { background: #555; color: #fff; }
.btn-import { background: #666; color: #fff; }
.btn-reset { background: #c0392b; color: #fff; }
.btn-cancel { background: #555; color: #fff; }

/* ========== SEARCH (admin) ========== */
.search-admin {
  margin: 0 16px 10px;
  position: relative;
}
.search-admin input {
  width: 100%;
  padding: 10px 14px 10px 36px;
  border: none;
  border-radius: 8px;
  background: rgba(255,255,255,0.1);
  color: #fff;
  font-size: 14px;
  outline: none;
}
.search-admin input::placeholder { color: rgba(255,255,255,0.4); }
.search-admin .icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: rgba(255,255,255,0.4);
}

/* ========== CONTINENT NAV ========== */
.continent-nav {
  display: flex;
  overflow-x: auto;
  padding: 0 16px 10px;
  gap: 6px;
}
.continent-nav::-webkit-scrollbar { display: none; }
.continent-tab {
  flex-shrink: 0;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  background: rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.6);
  border: none;
  cursor: pointer;
  white-space: nowrap;
}
.continent-tab.active {
  background: #ffd866;
  color: #0d1e44;
}

/* ========== CONTENT ========== */
.content { padding: 0 16px 100px; max-width: 640px; margin: 0 auto; }
.continent-section { display: none; }
.continent-section.active { display: block; }

/* ========== COUNTRY CARD (admin) ========== */
.country-card {
  background: #fff;
  border-radius: 12px;
  margin-bottom: 10px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.country-header {
  display: flex;
  align-items: center;
  padding: 12px 14px;
  cursor: pointer;
  transition: background .15s;
}
.country-header:active { background: #f8f9fb; }
.country-flag { font-size: 22px; margin-right: 10px; }
.country-name { font-size: 15px; font-weight: 600; color: #1a2a3a; flex: 1; }
.country-actions { display: flex; gap: 4px; }
.country-actions button {
  padding: 4px 10px;
  border: none;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
}
.btn-country-edit { background: #e8ecf1; color: #555; }
.btn-country-del { background: #ffe0e0; color: #c0392b; }

.visa-list { display: none; padding: 0 14px 12px; }
.country-card.expanded .visa-list { display: block; }

.visa-item {
  display: flex;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid #f0f2f5;
  gap: 6px;
}
.visa-item:last-child { border-bottom: none; }
.visa-type { flex: 1; font-size: 13px; color: #444; }
.visa-price-input {
  width: 80px;
  padding: 4px 6px;
  border: 2px solid #dab93c;
  border-radius: 4px;
  font-size: 13px;
  font-weight: 600;
  color: #c8a832;
  text-align: center;
  outline: none;
  background: #fffdf0;
}
.visa-price-input:focus { border-color: #0d1e44; }
.visa-mat-btn {
  font-size: 11px;
  padding: 3px 8px;
  background: #e8f4ff;
  color: #07c;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

/* ========== ADD COUNTRY FORM ========== */
.add-form {
  background: #fff;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
  display: none;
}
.add-form.show { display: block; }
.add-form h3 { font-size: 15px; margin-bottom: 10px; color: #1a2a3a; }
.add-form .row {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.add-form label {
  font-size: 12px;
  color: #888;
  display: block;
  margin-bottom: 2px;
}
.add-form input, .add-form select {
  flex: 1;
  min-width: 80px;
  padding: 6px 10px;
  border: 1px solid #ddd;
  border-radius: 6px;
  font-size: 13px;
  outline: none;
}
.add-form input:focus { border-color: #0d1e44; }
.add-form .types-area {
  width: 100%;
  min-height: 50px;
  padding: 8px;
  border: 1px solid #ddd;
  border-radius: 6px;
  font-size: 13px;
  resize: vertical;
  outline: none;
  margin-bottom: 8px;
}
.add-form .types-area:focus { border-color: #0d1e44; }
.add-form .hint {
  font-size: 11px;
  color: #999;
  margin-bottom: 8px;
}
.add-form .form-actions {
  display: flex;
  gap: 8px;
}
.add-form .form-actions button {
  flex: 1;
  padding: 8px;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.btn-form-add { background: #34a878; color: #fff; }
.btn-form-cancel { background: #e8eaef; color: #666; }

/* ========== MATERIAL MODAL (admin) ========== */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 500;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal-box {
  background: #fff;
  border-radius: 16px;
  width: 100%;
  max-width: 480px;
  max-height: 85vh;
  overflow-y: auto;
  padding: 20px;
}
.modal-box h3 { font-size: 16px; margin-bottom: 4px; }
.modal-box .modal-sub { font-size: 12px; color: #888; margin-bottom: 12px; }
.modal-close { float: right; background: none; border: none; font-size: 22px; color: #999; cursor: pointer; }

.mat-edit-item {
  display: flex;
  gap: 6px;
  margin-bottom: 6px;
  align-items: center;
}
.mat-edit-item input {
  flex: 1;
  padding: 6px 8px;
  border: 1px solid #ddd;
  border-radius: 4px;
  font-size: 13px;
}
.mat-edit-item .mat-del {
  background: none;
  border: none;
  color: #c0392b;
  font-size: 18px;
  cursor: pointer;
  padding: 0 4px;
}
.mat-add-row {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}
.mat-add-row input { flex: 1; padding: 6px 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; }
.mat-add-row button {
  padding: 6px 12px;
  background: #34a878;
  color: #fff;
  border: none;
  border-radius: 4px;
  font-size: 12px;
  cursor: pointer;
}
.modal-save-btn {
  width: 100%;
  margin-top: 12px;
  padding: 10px;
  background: #0d1e44;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

/* ========== IMPORT MODAL ========== */
.import-area {
  width: 100%;
  min-height: 200px;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 12px;
  font-family: monospace;
  resize: vertical;
  margin-bottom: 10px;
}
.import-btn {
  padding: 8px 20px;
  background: #c0392b;
  color: #fff;
  border: none;
  border-radius: 6px;
  font-weight: 600;
  cursor: pointer;
}

/* ========== TOAST ========== */
.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.8);
  color: #fff;
  padding: 10px 24px;
  border-radius: 8px;
  font-size: 14px;
  z-index: 999;
  display: none;
  white-space: nowrap;
}
</style>
</head>

<div class="top-bar">
  <div>
    <h1>🛠 邦德旅行 · 管理后台</h1>
    <span class="admin-badge">管理员</span>
  </div>
  <div class="top-actions">
    <a href="index.html" target="_blank">👁 预览前台</a>
  </div>
</div>

<div class="notice-editor">
  <label>📢 公告板内容（前台显示）</label>
  <textarea id="noticeInput" placeholder="输入公告内容，支持换行..."></textarea>
  <button onclick="saveNotice()">💾 保存公告</button>
</div>

<!-- Action Panel -->
<div class="panel">
  <button class="btn-add" onclick="toggleAddForm()">➕ 新增国家</button>
  <button class="btn-export" onclick="exportData()">📥 导出数据</button>
  <button class="btn-import" onclick="showImport()">📤 导入数据</button>
  <button class="btn-reset" onclick="resetData()">🔄 恢复默认</button>
</div>

<!-- Search -->
<div class="search-admin">
  <span class="icon">🔍</span>
  <input id="searchInput" type="text" placeholder="搜索国家..." oninput="filterAdmin()">
</div>

<!-- Continent Nav -->
<div class="continent-nav" id="continentNav"></div>

<!-- Content -->
<div class="content" id="content"></div>

<!-- Add Country Form -->
<div class="add-form" id="addForm">
  <h3>➕ 新增国家/地区</h3>
  <div class="row">
    <div style="flex:1;min-width:100px;">
      <label>国家名称</label>
      <input id="afName" placeholder="如：马来西亚">
    </div>
    <div style="flex:0 0 60px;">
      <label>国旗Emoji</label>
      <input id="afFlag" placeholder="🇲🇾" style="text-align:center;">
    </div>
    <div style="flex:0 0 100px;">
      <label>所属大洲</label>
      <select id="afContinent">
        <option value="欧洲">欧洲</option>
        <option value="美洲">美洲</option>
        <option value="亚洲">亚洲</option>
        <option value="大洋洲">大洋洲</option>
        <option value="非洲" selected>非洲</option>
      </select>
    </div>
  </div>
  <label>签证类型列表（每行一个）</label>
  <textarea class="types-area" id="afTypes" placeholder="旅游&#10;商务&#10;探亲访友"></textarea>
  <div class="hint">💡 每行一个签证类型，保存后可在列表中分别设置价格和材料</div>
  <div class="form-actions">
    <button class="btn-form-add" onclick="addCountry()">✅ 确认添加</button>
    <button class="btn-form-cancel" onclick="toggleAddForm()">取消</button>
  </div>
</div>

<!-- Materials Modal (admin) -->
<div class="modal-overlay" id="matModal" onclick="if(event.target===this)closeMatModal()">
  <div class="modal-box">
    <button class="modal-close" onclick="closeMatModal()">×</button>
    <h3 id="matModalTitle">编辑材料清单</h3>
    <div class="modal-sub" id="matModalSub">国家 · 签证类型</div>
    <div id="matModalContent"></div>
    <button class="modal-save-btn" onclick="saveMatModal()">💾 保存材料</button>
  </div>
</div>

<!-- Import Modal -->
<div class="modal-overlay" id="importModal" onclick="if(event.target===this)closeImportModal()">
  <div class="modal-box">
    <button class="modal-close" onclick="closeImportModal()">×</button>
    <h3>📤 导入数据</h3>
    <div class="modal-sub">粘贴之前导出的JSON数据</div>
    <textarea class="import-area" id="importArea" placeholder='{"欧洲":[...], ...}'></textarea>
    <button class="import-btn" onclick="doImport()">⚠️ 确认导入（将覆盖现有数据）</button>
  </div>
</div>

<div class="toast" id="toast"></div>

const CONTINENT_ORDER = ["欧洲","美洲","亚洲","大洋洲","非洲"];
const CONTINENT_ICONS = {"欧洲":"🌍","美洲":"🌎","亚洲":"🌏","大洋洲":"🌊","非洲":"🌍"};

let data, activeContinent = CONTINENT_ORDER[0];
let editCountryName = null; // for material modal

// ========== DATA ==========
function loadData() {
  const stored = localStorage.getItem("bondtravel_catalog");
  if (stored) { try { data = JSON.parse(stored); return; } catch(e) {} }
  data = {};
  CONTINENT_ORDER.forEach(c => {
    data[c] = (SEED_DATA[c] || []).map(x => ({...x, types:[...x.types], prices:{...x.prices}, materials:x.materials ? Object.fromEntries(Object.entries(x.materials).map(([k,v])=>[k,[...v]])) : {}}));
  });
  saveData();
}
function saveData() { localStorage.setItem("bondtravel_catalog", JSON.stringify(data)); }
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.display = "block";
  setTimeout(() => el.style.display = "none", 2000);
}

// ========== NOTICE ==========
function saveNotice() {
  const val = document.getElementById("noticeInput").value.trim();
  localStorage.setItem("bondtravel_notice", val);
  toast("✅ 公告已保存（前台刷新可见）");
}

// ========== RENDER ==========
function render() {
  loadData();
  const nav = document.getElementById("continentNav");
  const content = document.getElementById("content");
  nav.innerHTML = "";
  content.innerHTML = "";

  CONTINENT_ORDER.forEach((cont, i) => {
    const btn = document.createElement("button");
    btn.className = "continent-tab" + (i === 0 ? " active" : "");
    btn.textContent = CONTINENT_ICONS[cont] + " " + cont + " (" + (data[cont]||[]).length + ")";
    btn.onclick = () => { activeContinent = cont; render(); };
    nav.appendChild(btn);
  });

  const cont = activeContinent;
  const countries = data[cont] || [];
  const q = document.getElementById("searchInput").value.trim().toLowerCase();

  const section = document.createElement("div");
  section.className = "continent-section active";

  countries.forEach((c, idx) => {
    if (q && !c.name.toLowerCase().includes(q)) return;
    section.appendChild(createCountryCard(c, cont, idx));
  });

  content.appendChild(section);

  // Load notice
  document.getElementById("noticeInput").value = localStorage.getItem("bondtravel_notice") || "";
}

function createCountryCard(c, cont, idx) {
  const card = document.createElement("div");
  card.className = "country-card";
  card.dataset.country = c.name;

  const header = document.createElement("div");
  header.className = "country-header";
  header.onclick = () => card.classList.toggle("expanded");
  header.innerHTML = `
    <span class="country-flag">${c.flag || "🌐"}</span>
    <span class="country-name">${c.name} <span style="font-size:11px;color:#999;">(${c.types.length}种)</span></span>
    <span class="country-actions">
      <button class="btn-country-edit" onclick="event.stopPropagation();editCountry('${cont}','${c.name.replace(/'/g,"\\'")}',${idx})">✏️</button>
      <button class="btn-country-del" onclick="event.stopPropagation();delCountry('${cont}','${c.name.replace(/'/g,"\\'")}',${idx})">🗑</button>
    </span>
  `;
  card.appendChild(header);

  const list = document.createElement("div");
  list.className = "visa-list";

  c.types.forEach(type => {
    const price = c.prices[type] || "待询";
    const hasMat = c.materials && c.materials[type] && c.materials[type].length > 0;
    const item = document.createElement("div");
    item.className = "visa-item";
    item.innerHTML = `
      <span class="visa-type">${type}</span>
      <input class="visa-price-input" value="${price}" data-country="${c.name}" data-type="${type}" data-cont="${cont}" onchange="updatePrice(this)">
      <button class="visa-mat-btn" onclick="event.stopPropagation();openMatEditor('${cont}','${c.name.replace(/'/g,"\\'")}','${type.replace(/'/g,"\\'")}')">📄 ${hasMat ? '材料' : '+材料'}</button>
    `;
    list.appendChild(item);
  });

  card.appendChild(list);
  return card;
}

// ========== PRICE UPDATE ==========
function updatePrice(input) {
  const cont = input.dataset.cont;
  const name = input.dataset.country;
  const type = input.dataset.type;
  const c = data[cont].find(x => x.name === name);
  if (c) { c.prices[type] = input.value; saveData(); }
}

// ========== FILTER ==========
function filterAdmin() { render(); }

// ========== ADD COUNTRY ==========
function toggleAddForm() {
  document.getElementById("addForm").classList.toggle("show");
}
function addCountry() {
  const name = document.getElementById("afName").value.trim();
  const flag = document.getElementById("afFlag").value.trim() || "🌐";
  const cont = document.getElementById("afContinent").value;
  const typesText = document.getElementById("afTypes").value.trim();
  if (!name) { toast("⚠️ 请输入国家名称"); return; }
  const types = typesText.split("\n").map(s => s.trim()).filter(Boolean);
  if (types.length === 0) { toast("⚠️ 请至少输入一个签证类型"); return; }

  const prices = {};
  types.forEach(t => { prices[t] = "待询"; });

  data[cont] = data[cont] || [];
  data[cont].push({name, flag, types, prices, materials: {}});
  saveData();
  toast("✅ 已添加 " + name);
  toggleAddForm();
  document.getElementById("afName").value = "";
  document.getElementById("afFlag").value = "";
  document.getElementById("afTypes").value = "";
  render();
}

// ========== DELETE COUNTRY ==========
function delCountry(cont, name) {
  if (!confirm("确定删除「" + name + "」吗？")) return;
  data[cont] = (data[cont] || []).filter(c => c.name !== name);
  saveData();
  toast("🗑 已删除 " + name);
  render();
}

// ========== EDIT COUNTRY ==========
function editCountry(cont, name, idx) {
  const c = data[cont][idx];
  const newName = prompt("国家名称：", c.name);
  if (!newName || !newName.trim()) return;
  const newFlag = prompt("国旗Emoji（如 🇯🇵）：", c.flag || "");
  if (newFlag === null) return;
  const newTypes = prompt("签证类型（用逗号分隔）：", c.types.join("，"));
  if (!newTypes || !newTypes.trim()) return;

  c.name = newName.trim();
  if (newFlag) c.flag = newFlag.trim();

  // Handle types - preserve existing prices/materials, add new ones
  const newTypeList = newTypes.split(/[,，、]/).map(s => s.trim()).filter(Boolean);
  newTypeList.forEach(t => {
    if (!c.prices[t]) c.prices[t] = "待询";
  });
  Object.keys(c.prices).forEach(t => {
    if (!newTypeList.includes(t)) delete c.prices[t];
  });
  if (c.materials) {
    Object.keys(c.materials).forEach(t => {
      if (!newTypeList.includes(t)) delete c.materials[t];
    });
  }
  c.types = newTypeList;

  saveData();
  toast("✅ 已更新 " + newName.trim());
  render();
}

// ========== MATERIAL EDITOR ==========
function openMatEditor(cont, name, type) {
  editCountryName = {cont, name, type};
  document.getElementById("matModalTitle").textContent = "📋 " + name + " · " + type;
  document.getElementById("matModalSub").textContent = "编辑签证材料清单（每行一项）";

  const c = data[cont].find(x => x.name === name);
  if (!c) return;
  if (!c.materials) c.materials = {};
  if (!c.materials[type]) c.materials[type] = [];

  const container = document.getElementById("matModalContent");
  container.innerHTML = "";

  c.materials[type].forEach((mat, i) => {
    const row = document.createElement("div");
    row.className = "mat-edit-item";
    row.innerHTML = `<input value="${mat.replace(/"/g,'&quot;')}" data-idx="${i}"><button class="mat-del" onclick="removeMatItem(${i})">×</button>`;
    container.appendChild(row);
  });

  // Add new row
  const addRow = document.createElement("div");
  addRow.className = "mat-add-row";
  addRow.innerHTML = '<input id="newMatInput" placeholder="输入新材料项..."><button onclick="addMatItem()">➕ 添加</button>';
  container.appendChild(addRow);

  document.getElementById("matModal").classList.add("show");
}

function addMatItem() {
  const input = document.getElementById("newMatInput");
  const val = input.value.trim();
  if (!val) return;
  const c = data[editCountryName.cont].find(x => x.name === editCountryName.name);
  c.materials[editCountryName.type].push(val);
  input.value = "";
  openMatEditor(editCountryName.cont, editCountryName.name, editCountryName.type);
}

function removeMatItem(idx) {
  const c = data[editCountryName.cont].find(x => x.name === editCountryName.name);
  c.materials[editCountryName.type].splice(idx, 1);
  openMatEditor(editCountryName.cont, editCountryName.name, editCountryName.type);
}

function saveMatModal() {
  const container = document.getElementById("matModalContent");
  const inputs = container.querySelectorAll('.mat-edit-item input');
  const mats = Array.from(inputs).map(i => i.value.trim()).filter(Boolean);
  const c = data[editCountryName.cont].find(x => x.name === editCountryName.name);
  c.materials[editCountryName.type] = mats;
  saveData();
  toast("✅ 材料清单已保存");
  closeMatModal();
}

function closeMatModal() {
  document.getElementById("matModal").classList.remove("show");
}

// ========== EXPORT/IMPORT ==========
function exportData() {
  // Collect all data
  const exportObj = {version:1, data: data, notice: localStorage.getItem("bondtravel_notice") || ""};
  const json = JSON.stringify(exportObj, null, 2);
  const blob = new Blob([json], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "bondtravel_data_" + new Date().toISOString().slice(0,10) + ".json";
  a.click();
  URL.revokeObjectURL(url);
  toast("📥 数据已导出");
}

function showImport() {
  document.getElementById("importModal").classList.add("show");
}
function closeImportModal() {
  document.getElementById("importModal").classList.remove("show");
}
function doImport() {
  const text = document.getElementById("importArea").value.trim();
  if (!text) { toast("⚠️ 请粘贴数据"); return; }
  try {
    const obj = JSON.parse(text);
    if (!obj.data) { toast("⚠️ 数据格式无效"); return; }
    if (!confirm("⚠️ 此操作将覆盖所有现有数据，确定吗？")) return;
    data = obj.data;
    saveData();
    if (obj.notice) localStorage.setItem("bondtravel_notice", obj.notice);
    toast("✅ 数据已导入");
    closeImportModal();
    document.getElementById("importArea").value = "";
    render();
  } catch(e) {
    toast("⚠️ JSON解析失败: " + e.message);
  }
}

// ========== RESET ==========
function resetData() {
  if (!confirm("⚠️ 此操作将删除所有自定义数据，恢复出厂默认！确定吗？")) return;
  localStorage.removeItem("bondtravel_catalog");
  toast("🔄 已恢复默认数据");
  render();
}

// Init
render();
</script>
