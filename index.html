<html lang="zh-CN">

<title>帮得签证 · 产品目录</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif;
  background: #f0f2f5;
  color: #222;
  min-height: 100vh;
}

/* ========== HEADER ========== */
.header {
  background: linear-gradient(135deg, #0d1e44 0%, #1a3a6b 100%);
  padding: 24px 16px 16px;
  color: #fff;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header h1 { font-size: 20px; font-weight: 700; letter-spacing: 2px; }
.header .brand-sub {
  font-size: 12px;
  color: #8ab4f8;
  margin-top: 2px;
  letter-spacing: 1px;
}
.header .slogan {
  font-size: 13px;
  color: #ffd866;
  margin-top: 6px;
  font-weight: 600;
  letter-spacing: 2px;
}

/* ========== SEARCH ========== */
.search-bar {
  margin: 10px 16px 0;
  position: relative;
}
.search-bar input {
  width: 100%;
  padding: 10px 14px 10px 36px;
  border: none;
  border-radius: 8px;
  background: rgba(255,255,255,0.15);
  color: #fff;
  font-size: 14px;
  outline: none;
}
.search-bar input::placeholder { color: rgba(255,255,255,0.5); }
.search-bar .icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: rgba(255,255,255,0.5);
  font-size: 16px;
}

/* ========== NOTICE BOARD ========== */
.notice-board {
  margin: 8px 16px 0;
  padding: 8px 12px;
  background: rgba(255,215,0,0.12);
  border: 1px solid rgba(255,215,0,0.25);
  border-radius: 8px;
  font-size: 12px;
  color: #ffd866;
  display: flex;
  align-items: flex-start;
  gap: 6px;
  line-height: 1.6;
  max-height: 60px;
  overflow: hidden;
  transition: max-height .3s;
  cursor: pointer;
}
.notice-board.open { max-height: 300px; }
.notice-board .nt-icon { flex-shrink: 0; font-size: 14px; margin-top: 1px; }
.notice-board .nt-text { flex: 1; }
.notice-board .nt-more {
  flex-shrink: 0;
  color: rgba(255,215,0,0.5);
  font-size: 11px;
}

/* ========== CONTINENT NAV ========== */
.continent-nav {
  display: flex;
  overflow-x: auto;
  padding: 10px 16px;
  gap: 8px;
  background: #fff;
  border-bottom: 1px solid #e8eaef;
  position: sticky;
  top: 120px;
  z-index: 99;
}
.continent-nav::-webkit-scrollbar { display: none; }
.continent-tab {
  flex-shrink: 0;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  background: #f0f2f5;
  color: #666;
  border: none;
  cursor: pointer;
  transition: all .2s;
  white-space: nowrap;
}
.continent-tab.active {
  background: #0d1e44;
  color: #fff;
}
.continent-tab .count {
  font-size: 11px;
  opacity: .7;
  margin-left: 2px;
}

.content { padding: 12px 16px 80px; max-width: 640px; margin: 0 auto; }
.continent-section { display: none; }
.continent-section.active { display: block; }

/* ========== COUNTRY CARD ========== */
.country-card {
  background: #fff;
  border-radius: 12px;
  margin-bottom: 10px;
  overflow: hidden;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.country-header {
  display: flex;
  align-items: center;
  padding: 14px 16px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background .15s;
}
.country-header:active { background: #f8f9fb; }
.country-flag { font-size: 24px; margin-right: 12px; width: 28px; text-align: center; }
.country-name { font-size: 16px; font-weight: 600; color: #1a2a3a; flex: 1; }
.country-count { font-size: 12px; color: #999; margin-right: 8px; }
.country-arrow {
  font-size: 14px; color: #ccc;
  transition: transform .25s ease;
}
.country-card.expanded .country-arrow { transform: rotate(180deg); }

.visa-list { display: none; padding: 0 16px 14px; }
.country-card.expanded .visa-list { display: block; }

.visa-item {
  display: flex;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid #f0f2f5;
  gap: 6px;
}
.visa-item:last-child { border-bottom: none; }
.visa-type {
  flex: 1;
  font-size: 14px;
  color: #444;
}
.visa-price {
  font-size: 14px;
  font-weight: 600;
  color: #c8a832;
  min-width: 60px;
  text-align: right;
  white-space: nowrap;
}
.visa-dl {
  font-size: 12px;
  color: #07c;
  text-decoration: none;
  padding: 4px 10px;
  border: 1px solid #07c;
  border-radius: 6px;
  white-space: nowrap;
  cursor: pointer;
}
.visa-dl:active { background: #07c; color: #fff; }

/* ========== DOWNLOAD ITEMS ========== */
.dl-item {
  display: flex;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid #f0f2f5;
  gap: 12px;
}
.dl-item:last-child { border-bottom: none; }
.dl-icon { font-size: 28px; flex-shrink: 0; }
.dl-info { flex: 1; }
.dl-title { font-size: 14px; font-weight: 600; color: #1a2a3a; }
.dl-desc { font-size: 12px; color: #888; margin-top: 2px; }
.dl-btn {
  padding: 6px 14px;
  background: #0d1e44;
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  text-decoration: none;
  white-space: nowrap;
  cursor: pointer;
}
.dl-btn:active { opacity: .8; }
.dl-btn-outline {
  background: transparent;
  color: #0d1e44;
  border: 1.5px solid #0d1e44;
}
.dl-tag {
  display: inline-block;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 4px;
  margin-left: 6px;
  background: #e8f4ff;
  color: #07c;
}

.no-result {
  text-align: center;
  padding: 40px 16px;
  color: #999;
  font-size: 14px;
}

/* ========== MATERIAL MODAL ========== */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 500;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal-box {
  background: #fff;
  border-radius: 16px;
  width: 100%;
  max-width: 420px;
  max-height: 80vh;
  overflow-y: auto;
  padding: 24px 20px 20px;
}
.modal-box h3 {
  font-size: 17px;
  margin-bottom: 4px;
  color: #1a2a3a;
}
.modal-box .modal-sub {
  font-size: 13px;
  color: #888;
  margin-bottom: 14px;
}
.modal-close {
  float: right;
  background: none;
  border: none;
  font-size: 22px;
  color: #999;
  cursor: pointer;
  padding: 0 4px;
}
.material-item {
  padding: 10px 0;
  border-bottom: 1px solid #f0f2f5;
  display: flex;
  align-items: flex-start;
  gap: 8px;
}
.material-item:last-child { border-bottom: none; }
.material-item .mat-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
.material-item .mat-text { font-size: 13px; color: #444; line-height: 1.5; }

/* ========== FOOTER ========== */
.footer {
  text-align: center;
  padding: 20px 16px;
  font-size: 12px;
  color: #aaa;
}
.footer .brand-name {
  font-weight: 600;
  color: #0d1e44;
}
</style>

const CONTINENT_ORDER = ["欧洲","美洲","亚洲","大洋洲","非洲"];
const CONTINENT_ICONS = {"欧洲":"🌍","美洲":"🌎","亚洲":"🌏","大洋洲":"🌊","非洲":"🌍"};

let data;
let activeContinent = CONTINENT_ORDER[0];

// ========== DATA LOAD / SAVE ==========
function loadData() {
  const stored = localStorage.getItem("bondtravel_catalog");
  if (stored) {
    try {
      data = JSON.parse(stored);
      return;
    } catch(e) {}
  }
  // Deep clone seed
  data = {};
  CONTINENT_ORDER.forEach(cont => {
    data[cont] = (SEED_DATA[cont] || []).map(c => ({
      ...c,
      types: [...c.types],
      prices: {...c.prices},
      materials: c.materials ? Object.fromEntries(Object.entries(c.materials).map(([k,v]) => [k,[...v]])) : {}
    }));
  });
  saveData();
}

function saveData() {
  localStorage.setItem("bondtravel_catalog", JSON.stringify(data));
}

// ========== SEARCH FIX ==========
function filterProducts() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const sections = document.querySelectorAll(".continent-section");
  const tabs = document.querySelectorAll(".continent-tab");

  if (q) {
    // Search mode: show all sections
    sections.forEach(s => { s.style.display = "block"; });
    tabs.forEach(t => t.classList.remove("active"));
  } else {
    // Reset to active continent
    sections.forEach(s => s.classList.remove("active"));
    document.getElementById("section-" + activeContinent).classList.add("active");
    tabs.forEach(t => {
      if (t.dataset.continent === activeContinent) t.classList.add("active");
    });
  }

  let visibleCount = 0;
  document.querySelectorAll(".country-card").forEach(card => {
    const name = card.dataset.country.toLowerCase();
    const types = JSON.parse(card.dataset.types || "[]");
    const match = !q || name.includes(q) || types.some(t => t.includes(q));
    card.style.display = match ? "" : "none";
    if (match) visibleCount++;
  });

  const nr = document.getElementById("noResult");
  if (q && visibleCount === 0) {
    if (!nr) {
      const el = document.createElement("div");
      el.id = "noResult";
      el.className = "no-result";
      document.getElementById("content").appendChild(el);
    }
    document.getElementById("noResult").textContent = '😕 未找到 "' + q + '"，试试其他关键词';
    document.getElementById("noResult").style.display = "";
  } else if (nr) {
    nr.style.display = "none";
  }
}

// ========== MATERIAL MODAL ==========
function showMaterials(countryName, visaType) {
  const c = getCountry(countryName);
  if (!c) return;

  document.getElementById("modalTitle").textContent = "📋 " + countryName + " · 材料清单";
  document.getElementById("modalSub").textContent = "签证类型：" + visaType;

  const content = document.getElementById("modalContent");
  content.innerHTML = "";

  let mats = [];
  if (c.materials && c.materials[visaType]) {
    mats = c.materials[visaType];
  } else if (c.materials && c.materials["旅游"]) {
    mats = c.materials["旅游"];
  } else {
    mats = ["有效护照（6个月以上）", "2寸白底彩照2张", "户口本全本复印件", "在职证明+营业执照副本（盖章）", "近6个月银行流水", "房产/车产证明", "行程计划+机票酒店预订", "申请表（亲笔签名）"];
  }

  mats.forEach((m, i) => {
    const item = document.createElement("div");
    item.className = "material-item";
    item.innerHTML = `<span class="mat-icon">${i+1}.</span><span class="mat-text">${m}</span>`;
    content.appendChild(item);
  });

  document.getElementById("modalOverlay").classList.add("show");
}

function closeModal(e) {
  if (e && e.target !== document.getElementById("modalOverlay")) return;
  document.getElementById("modalOverlay").classList.remove("show");
}

// ========== NOTICE BOARD ==========
function toggleNotice() {
  document.getElementById("noticeBoard").classList.toggle("open");
  document.getElementById("noticeMore").textContent =
    document.getElementById("noticeBoard").classList.contains("open") ? "收起 ∧" : "展开 ∨";
}

// ========== HELPERS ==========
function getCountry(name) {
  for (const cont of CONTINENT_ORDER) {
    const c = (data[cont] || []).find(x => x.name === name);
    if (c) return c;
  }
  return null;
}

// ========== RENDER ==========
function init() {
  loadData();

  const nav = document.getElementById("continentNav");
  const content = document.getElementById("content");

  // Nav tabs
  CONTINENT_ORDER.forEach((cont, i) => {
    const btn = document.createElement("button");
    btn.className = "continent-tab" + (i === 0 ? " active" : "");
    btn.dataset.continent = cont;
    btn.textContent = CONTINENT_ICONS[cont] + " " + cont;
    const span = document.createElement("span");
    span.className = "count";
    const countries = data[cont] || [];
    span.textContent = "(" + countries.length + ")";
    btn.appendChild(span);
    btn.onclick = () => switchContinent(cont);
    nav.appendChild(btn);
  });

  // Download tab
  const dlTab = document.createElement("button");
  dlTab.className = "continent-tab";
  dlTab.textContent = "📥 资料下载";
  dlTab.onclick = () => showDownloads();
  nav.appendChild(dlTab);

  // Sections
  CONTINENT_ORDER.forEach((cont, i) => {
    const section = document.createElement("div");
    section.className = "continent-section" + (i === 0 ? " active" : "");
    section.id = "section-" + cont;

    const countries = data[cont] || [];
    countries.forEach(c => section.appendChild(createCountryCard(c)));

    content.appendChild(section);
  });

  // Notice board
  updateNotice();

  // Search input fix: restore active continent on clear
  document.getElementById("searchInput").addEventListener("search", function() {
    if (!this.value) filterProducts();
  });
}

function createCountryCard(c) {
  const card = document.createElement("div");
  card.className = "country-card";
  card.id = "card-" + c.name;
  card.dataset.country = c.name;
  card.dataset.types = JSON.stringify(c.types);

  const flag = c.flag || "🌐";

  const header = document.createElement("div");
  header.className = "country-header";
  header.onclick = () => card.classList.toggle("expanded");
  header.innerHTML = `
    <span class="country-flag">${flag}</span>
    <span class="country-name">${c.name}</span>
    <span class="country-count">${c.types.length}种</span>
    <span class="country-arrow">▼</span>
  `;
  card.appendChild(header);

  const list = document.createElement("div");
  list.className = "visa-list";

  c.types.forEach(type => {
    const price = c.prices[type] || "待询";
    const item = document.createElement("div");
    item.className = "visa-item";
    item.innerHTML = `
      <span class="visa-type">${type}</span>
      <span class="visa-price" id="price-${c.name}-${type}">${price}</span>
      <a class="visa-dl" onclick="showMaterials('${c.name.replace(/'/g,"\\'")}','${type.replace(/'/g,"\\'")}')">📄 材料</a>
    `;
    list.appendChild(item);
  });

  card.appendChild(list);
  return card;
}

function switchContinent(cont) {
  activeContinent = cont;
  document.querySelectorAll(".continent-tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".continent-section").forEach(s => s.classList.remove("active"));
  document.querySelector(`.continent-tab[data-continent="${cont}"]`).classList.add("active");
  document.getElementById("section-" + cont).classList.add("active");

  // Clear search
  document.getElementById("searchInput").value = "";
  filterProducts();
}

function updateNotice() {
  const saved = localStorage.getItem("bondtravel_notice");
  const text = saved || "🌟 帮得签证——您的签证小管家！专业签证办理，出国旅游、商务洽谈、探亲访友，一站式服务。点击展开查看详情 →";
  document.getElementById("noticeText").textContent = text;
}

// ========== DOWNLOAD MATERIALS ==========
function getDownloads() {
  const stored = localStorage.getItem("bondtravel_downloads");
  if (stored) { try { return JSON.parse(stored); } catch(e) {} }
  return [];
}

function showDownloads() {
  const downloads = getDownloads();
  const container = document.getElementById("dlContent");
  const empty = document.getElementById("dlEmpty");

  container.innerHTML = "";

  if (downloads.length === 0) {
    empty.style.display = "block";
  } else {
    empty.style.display = "none";
    downloads.forEach((d, i) => {
      const icon = d.icon || "📄";
      const tagHtml = d.tag ? `<span class="dl-tag">${d.tag}</span>` : "";
      const btnHtml = d.url
        ? `<a class="dl-btn" href="${d.url}" target="_blank" rel="noopener">⬇ 下载</a>`
        : `<span class="dl-btn dl-btn-outline" style="color:#999;border-color:#ccc;">暂无文件</span>`;
      const div = document.createElement("div");
      div.className = "dl-item";
      div.innerHTML = `
        <span class="dl-icon">${icon}</span>
        <div class="dl-info">
          <div class="dl-title">${d.title}${tagHtml}</div>
          <div class="dl-desc">${d.desc || ""}</div>
        </div>
        ${btnHtml}
      `;
      container.appendChild(div);
    });
  }

  document.getElementById("dlModal").classList.add("show");
}

function closeDlModal() {
  document.getElementById("dlModal").classList.remove("show");
}

init();
</script>
