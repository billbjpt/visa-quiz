<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>帮得签证 · 产品目录</title>
<style>
:root {
  --bg-page: #f0f2f5;
  --bg-card: #fff;
  --bg-modal: #fff;
  --bg-hint: rgba(255,255,255,0.15);
  --text-primary: #222;
  --text-secondary: #444;
  --text-muted: #888;
  --text-light: #999;
  --text-white: #fff;
  --border-light: #f0f2f5;
  --accent-main: #0d1e44;
  --accent-blue: #07c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg-page: #111;
    --bg-card: #1e1e1e;
    --bg-modal: #2a2a2a;
    --bg-hint: rgba(255,255,255,0.08);
    --text-primary: #f5f5f5;
    --text-secondary: #ddd;
    --text-muted: #c0c0c0;
    --text-light: #aaa;
    --text-white: #fff;
    --border-light: #444;
    --accent-main: #5a8cd4;
    --accent-blue: #6ab4ff;
  }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif;
  background: var(--bg-page);
  color: var(--text-primary);
  min-height: 100vh;
}

/* ========== HEADER ========== */
.header {
  background: linear-gradient(135deg, #0d1e44 0%, #1a3a6b 100%);
  padding: 24px 16px 16px;
  color: #fff;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header h1 { font-size: 20px; font-weight: 700; letter-spacing: 2px; }
.header .brand-sub {
  font-size: 12px;
  color: #8ab4f8;
  margin-top: 2px;
  letter-spacing: 1px;
}
.header .slogan {
  font-size: 13px;
  color: #ffd866;
  margin-top: 6px;
  font-weight: 600;
  letter-spacing: 2px;
}

/* ========== SEARCH ========== */
.search-bar {
  margin: 10px 16px 0;
  position: relative;
}
.search-bar input {
  width: 100%;
  padding: 10px 14px 10px 36px;
  border: none;
  border-radius: 8px;
  background: rgba(255,255,255,0.15);
  color: #fff;
  font-size: 14px;
  outline: none;
}
.search-bar input::placeholder { color: rgba(255,255,255,0.5); }
.search-bar .icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: rgba(255,255,255,0.5);
  font-size: 16px;
}

/* ========== NOTICE BOARD ========== */
.notice-board {
  margin: 8px 16px 0;
  padding: 8px 12px;
  background: rgba(255,215,0,0.12);
  border: 1px solid rgba(255,215,0,0.25);
  border-radius: 8px;
  font-size: 12px;
  color: #ffd866;
  display: flex;
  align-items: center;
  gap: 6px;
  line-height: 1.6;
  overflow: hidden;
  white-space: nowrap;
}
.notice-board .nt-icon { flex-shrink: 0; font-size: 14px; }
.notice-board .nt-wrap {
  flex: 1;
  overflow: hidden;
  position: relative;
  height: 1.6em;
}
.notice-board .nt-text {
  display: inline-block;
  white-space: nowrap;
  animation: scrollNotice 20s linear infinite;
  padding-left: 100%;
}
@keyframes scrollNotice {
  0% { transform: translateX(0); }
  100% { transform: translateX(-100%); }
}

/* ========== CONTINENT NAV ========== */
.continent-nav {
  display: flex;
  overflow-x: auto;
  padding: 10px 16px;
  gap: 8px;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border-light);
  position: sticky;
  top: 120px;
  z-index: 99;
}
.continent-nav::-webkit-scrollbar { display: none; }
.continent-tab {
  flex-shrink: 0;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  background: var(--bg-page);
  color: var(--text-muted);
  border: none;
  cursor: pointer;
  transition: all .2s;
  white-space: nowrap;
}
.continent-tab.active {
  background: var(--accent-main);
  color: var(--text-white);
}
.continent-tab .count {
  font-size: 11px;
  opacity: .7;
  margin-left: 2px;
}

.content { padding: 12px 16px 80px; max-width: 640px; margin: 0 auto; }
.continent-section { display: none; }
.continent-section.active { display: block; }

/* ========== COUNTRY CARD ========== */
.country-card {
  background: var(--bg-card);
  border-radius: 12px;
  margin-bottom: 10px;
  overflow: hidden;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.country-header {
  display: flex;
  align-items: center;
  padding: 14px 16px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background .15s;
}
.country-header:active { background: var(--bg-page); }
.country-flag { font-size: 24px; margin-right: 12px; width: 28px; text-align: center; }
.country-name { font-size: 16px; font-weight: 600; color: var(--text-primary); flex: 1; }
.country-count { font-size: 12px; color: var(--text-light); margin-right: 8px; }
.country-arrow {
  font-size: 14px; color: var(--text-light);
  transition: transform .25s ease;
}
.country-card.expanded .country-arrow { transform: rotate(180deg); }

.visa-list { display: none; padding: 0 16px 14px; }
.country-card.expanded .visa-list { display: block; }

.visa-item {
  display: flex;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--border-light);
  gap: 6px;
}
.visa-item:last-child { border-bottom: none; }
.visa-type {
  flex: 1;
  font-size: 14px;
  color: var(--text-secondary);
}
.visa-price {
  font-size: 14px;
  font-weight: 600;
  color: #c8a832;
  min-width: 60px;
  text-align: right;
  white-space: nowrap;
}
.visa-dl {
  font-size: 12px;
  color: var(--accent-blue);
  text-decoration: none;
  padding: 4px 10px;
  border: 1px solid var(--accent-blue);
  border-radius: 6px;
  white-space: nowrap;
  cursor: pointer;
}
.visa-dl:active { background: var(--accent-blue); color: #fff; }

/* ========== DOWNLOAD ITEMS ========== */
.dl-item {
  display: flex;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid var(--border-light);
  gap: 12px;
}
.dl-item:last-child { border-bottom: none; }
.dl-icon { font-size: 28px; flex-shrink: 0; }
.dl-info { flex: 1; }
.dl-title { font-size: 14px; font-weight: 600; color: var(--text-primary); }
.dl-desc { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.dl-btn {
  padding: 6px 14px;
  background: var(--accent-main);
  color: var(--text-white);
  border: none;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  text-decoration: none;
  white-space: nowrap;
  cursor: pointer;
}
.dl-btn:active { opacity: .8; }
.dl-btn-outline {
  background: transparent;
  color: var(--accent-main);
  border: 1.5px solid var(--accent-main);
}
.dl-tag {
  display: inline-block;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 4px;
  margin-left: 6px;
  background: var(--bg-page);
  color: var(--accent-blue);
}

.no-result {
  text-align: center;
  padding: 40px 16px;
  color: var(--text-muted);
  font-size: 14px;
}

/* ========== MATERIAL MODAL ========== */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 500;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal-box {
  background: var(--bg-modal);
  border-radius: 16px;
  width: 100%;
  max-width: 420px;
  max-height: 80vh;
  overflow-y: auto;
  padding: 24px 20px 20px;
}
.modal-box h3 {
  font-size: 17px;
  margin-bottom: 4px;
  color: var(--text-primary);
}
.modal-box .modal-sub {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 14px;
}
.modal-close {
  float: right;
  background: none;
  border: none;
  font-size: 22px;
  color: var(--text-light);
  cursor: pointer;
  padding: 0 4px;
}
.material-item {
  padding: 10px 0;
  border-bottom: 1px solid var(--border-light);
  display: flex;
  align-items: flex-start;
  gap: 8px;
}
.material-item:last-child { border-bottom: none; }
.material-item .mat-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
.material-item .mat-text { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }

/* ========== FOOTER ========== */
.footer {
  text-align: center;
  padding: 20px 16px;
  font-size: 12px;
  color: var(--text-light);
}
.footer .brand-name {
  font-weight: 600;
  color: var(--accent-main);
}

/* 无PDF样式 */
.visa-dl.no-pdf {
  opacity: 0.35;
  cursor: not-allowed !important;
  pointer-events: auto !important;
}
.visa-dl.no-pdf:hover {
  color: #999 !important;
  text-decoration: none !important;
}

/* Persona Modal */
.persona-btn{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:1px solid var(--border-light);border-radius:10px;background:var(--bg-card);margin-bottom:8px;cursor:pointer;transition:all .15s;text-decoration:none;color:var(--text-primary)}
.persona-btn:active{background:var(--bg-page);transform:scale(0.98)}
.persona-icon{font-size:24px;flex-shrink:0}
.persona-label{font-size:14px;font-weight:600}
</style>
</head>

<div class="header">

const CONTINENT_ORDER = ["欧洲","美洲","亚洲","大洋洲","非洲"];
const CONTINENT_ICONS = {"欧洲":"🌍","美洲":"🌎","亚洲":"🌏","大洋洲":"🌊","非洲":"🌍"};

let data;
let activeContinent = CONTINENT_ORDER[0];

// ========== DATA LOAD / SAVE ==========
const APP_VERSION = "100.001.002";
function loadData() {
  const stored = localStorage.getItem("bondtravel_catalog");
  const storedVersion = localStorage.getItem("bondtravel_version");
  if (stored && storedVersion === APP_VERSION) {
    try {
      data = JSON.parse(stored);
      return;
    } catch(e) {}
  }
  // Version changed or no cache - reload from SEED_DATA
  localStorage.removeItem("bondtravel_catalog");
  data = {};
  CONTINENT_ORDER.forEach(cont => {
    data[cont] = (SEED_DATA[cont] || []).map(c => ({
      ...c,
      types: [...c.types],
      prices: {...c.prices},
      materials: c.materials ? Object.fromEntries(Object.entries(c.materials).map(([k,v]) => [k, Array.isArray(v) ? [...v] : {...v}])) : {}
    }));
  });
  localStorage.setItem("bondtravel_version", APP_VERSION);
  saveData();
}

function saveData() {
  localStorage.setItem("bondtravel_catalog", JSON.stringify(data));
}

// ========== SEARCH FIX ==========
function filterProducts() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const sections = document.querySelectorAll(".continent-section");
  const tabs = document.querySelectorAll(".continent-tab");

  if (q) {
    // Search mode: show all sections
    sections.forEach(s => { s.style.display = "block"; });
    tabs.forEach(t => t.classList.remove("active"));
  } else {
    // Reset to active continent
    sections.forEach(s => s.classList.remove("active"));
    document.getElementById("section-" + activeContinent).classList.add("active");
    tabs.forEach(t => {
      if (t.dataset.continent === activeContinent) t.classList.add("active");
    });
  }

  let visibleCount = 0;
  document.querySelectorAll(".country-card").forEach(card => {
    const name = card.dataset.country.toLowerCase();
    const types = JSON.parse(card.dataset.types || "[]");
    const match = !q || name.includes(q) || types.some(t => t.includes(q));
    card.style.display = match ? "" : "none";
    if (match) visibleCount++;
  });

  const nr = document.getElementById("noResult");
  if (q && visibleCount === 0) {
    if (!nr) {
      const el = document.createElement("div");
      el.id = "noResult";
      el.className = "no-result";
      document.getElementById("content").appendChild(el);
    }
    document.getElementById("noResult").textContent = '😕 未找到 "' + q + '"，试试其他关键词';
    document.getElementById("noResult").style.display = "";
  } else if (nr) {
    nr.style.display = "none";
  }
}

// ========== MATERIAL MODAL ==========
function sanitizeName(s) {
  // PDF文件名规范: 把 / ( ) · 替换为 _，去除多余空格和首尾下划线
  return s.replace(/[\/()（）、·]/g, '_').replace(/\s+/g, '').replace(/^_+|_+$/g, '');
}

// ========== HELPERS ==========
function getCountry(name) {
  for (const cont of CONTINENT_ORDER) {
    const c = (data[cont] || []).find(x => x.name === name);
    if (c) return c;
  }
  return null;
}

// ========== RENDER ==========
function init() {
  loadData();

  const nav = document.getElementById("continentNav");
  const content = document.getElementById("content");

  // Nav tabs
  CONTINENT_ORDER.forEach((cont, i) => {
    const btn = document.createElement("button");
    btn.className = "continent-tab" + (i === 0 ? " active" : "");
    btn.dataset.continent = cont;
    btn.textContent = CONTINENT_ICONS[cont] + " " + cont;
    const span = document.createElement("span");
    span.className = "count";
    const countries = data[cont] || [];
    span.textContent = "(" + countries.length + ")";
    btn.appendChild(span);
    btn.onclick = () => switchContinent(cont);
    nav.appendChild(btn);
  });

  // Download tab
  const dlTab = document.createElement("button");
  dlTab.className = "continent-tab";
  dlTab.textContent = "📥 资料下载";
  dlTab.onclick = () => showDownloads();
  nav.appendChild(dlTab);

  // Sections
  CONTINENT_ORDER.forEach((cont, i) => {
    const section = document.createElement("div");
    section.className = "continent-section" + (i === 0 ? " active" : "");
    section.id = "section-" + cont;

    const countries = data[cont] || [];
    countries.forEach(c => {
      // Only show countries that have at least one visa type with a real price
      const hasPrice = c.types.some(t => c.prices[t] && c.prices[t] !== "待询");
      if (hasPrice) section.appendChild(createCountryCard(c));
    });

    content.appendChild(section);
  });

  // Notice board
  updateNotice();

  // Search input fix: restore active continent on clear
  document.getElementById("searchInput").addEventListener("search", function() {
    if (!this.value) filterProducts();
  });
}

function createCountryCard(c) {
  const card = document.createElement("div");
  card.className = "country-card";
  card.id = "card-" + c.name;
  card.dataset.country = c.name;
  card.dataset.types = JSON.stringify(c.types);

  const flag = c.flag || "🌐";

  const header = document.createElement("div");
  header.className = "country-header";
  header.onclick = () => card.classList.toggle("expanded");
  header.innerHTML = `
    <span class="country-flag">${flag}</span>
    <span class="country-name">${c.name}</span>
    <span class="country-count">${c.types.length}种</span>
    <span class="country-arrow">▼</span>
  `;
  card.appendChild(header);

  const list = document.createElement("div");
  list.className = "visa-list";

  c.types.forEach(type => {
        const price = c.prices[type] || "待询";
    const key = sanitizeName(c.name) + '_' + sanitizeName(type);
    const hasPdf = PDF_EXISTS.has(key);
    const item = document.createElement("div");
    item.className = "visa-item";
    item.innerHTML = `
      <span class="visa-type">${type}</span>
      <span class="visa-price" id="price-${c.name}-${type}">${price}</span>
      <a class=\"visa-dl${hasPdf ? '' : ' no-pdf'}\" href=\"javascript:void(0)\" onclick=\"${hasPdf ? 'handleDlClick(\''+c.name+'\',\''+type+'\')' : 'showNoPdf()'}\">📄 材料</a>
    `;
    list.appendChild(item);
  });

  card.appendChild(list);
  return card;
}

function switchContinent(cont) {
  activeContinent = cont;
  document.querySelectorAll(".continent-tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".continent-section").forEach(s => s.classList.remove("active"));
  document.querySelector(`.continent-tab[data-continent="${cont}"]`).classList.add("active");
  document.getElementById("section-" + cont).classList.add("active");

  // Clear search
  document.getElementById("searchInput").value = "";
  filterProducts();
}

function updateNotice() {
  const saved = localStorage.getItem("bondtravel_notice");
  const text = saved || "🌟 帮得签证——您的签证小管家！专业签证办理，出国旅游、商务洽谈、探亲访友，一站式服务。点击展开查看详情 →";
  document.getElementById("noticeText").textContent = text;
}

function getDownloads() {
  const stored = localStorage.getItem("bondtravel_downloads");
  if (stored) { try { return JSON.parse(stored); } catch(e) {} }
  // Seed data
  const BASE = "https://billbjpt.github.io/visa-quiz/pdf/";
  return [
    {title:"在职证明模板（中英双语）", url:BASE+"employment_letter_template.pdf", desc:"通用在职证明模板，中英文对照，含公司信息、职位、收入等", icon:"📋", tag:"模板"},
    {title:"申根签证申请指南", url:BASE+"schengen_visa_guide.pdf", desc:"29国申根区签证全流程，材料清单+注意事项", icon:"🌍", tag:"指南"},
    {title:"美国DS-160填写指南", url:BASE+"us_visa_ds160_guide.pdf", desc:"DS-160在线表格逐项指南，常见错误避免", icon:"🇺🇸", tag:"指南"},
    {title:"签证材料通用清单", url:BASE+"visa_checklist_general.pdf", desc:"核心材料 + 在职/财务/特殊人群所需材料一览", icon:"📄", tag:"清单"},
    {title:"帮得签证公司简介", url:BASE+"bangde_visa_brochure.pdf", desc:"公司介绍、服务范围、联系方式", icon:"🏢", tag:"简介"},
  ];
}

function showDownloads() {
  const downloads = getDownloads();
  const container = document.getElementById("dlContent");
  const empty = document.getElementById("dlEmpty");

  container.innerHTML = "";

  if (downloads.length === 0) {
    empty.style.display = "block";
  } else {
    empty.style.display = "none";
    downloads.forEach((d, i) => {
      const icon = d.icon || "📄";
      const tagHtml = d.tag ? `<span class="dl-tag">${d.tag}</span>` : "";
      const btnHtml = d.url
        ? `<a class="dl-btn" href="${d.url}" target="_blank" rel="noopener">⬇ 下载</a>`
        : `<span class="dl-btn dl-btn-outline">暂无文件</span>`;
      const div = document.createElement("div");
      div.className = "dl-item";
      div.innerHTML = `
        <span class="dl-icon">${icon}</span>
        <div class="dl-info">
          <div class="dl-title">${d.title}${tagHtml}</div>
          <div class="dl-desc">${d.desc || ""}</div>
        </div>
        ${btnHtml}
      `;
      container.appendChild(div);
    });
  }

  document.getElementById("dlModal").classList.add("show");
}

function closeDlModal() {
  document.getElementById("dlModal").classList.remove("show");
}

init();

function handleDlClick(countryName, visaType) {
  console.log('[DEBUG] handleDlClick called:', countryName, visaType);
  var country = null;
  for (var cont in data) {
    for (var i = 0; i < data[cont].length; i++) {
      if (data[cont][i].name === countryName) { country = data[cont][i]; break; }
    }
    if (country) break;
  }
  console.log('[DEBUG] country found:', !!country);
  console.log('[DEBUG] country.materials:', country ? country.materials : 'null');
  if (!country || !country.materials) { window.open(materialUrl(countryName, visaType)); return; }
  
  var mat = country.materials[visaType];
  console.log('[DEBUG] mat:', mat);
  console.log('[DEBUG] mat.personas:', mat ? mat.personas : 'null');
  if (mat && mat.personas && mat.personas.length > 0) {
    console.log('[DEBUG] Showing persona modal with', mat.personas.length, 'personas');
    showPersonaModal(countryName, visaType, mat.personas, mat.url);
  } else {
    console.log('[DEBUG] No personas, opening direct download');
    window.open(materialUrl(countryName, visaType));
  }
}

function showPersonaModal(countryName, visaType, personas, genericUrl) {
  document.getElementById("personaTitle").textContent = countryName + " · " + visaType;
  document.getElementById("personaSub").textContent = "请选择您的身份，下载对应材料清单";
  var container = document.getElementById("personaContent");
  container.innerHTML = "";
  var icons = {"在职人员":"👔","学生":"🎓","退休人员":"👴","自由职业/无业":"💼"};
  personas.forEach(function(p) {
    var btn = document.createElement("a");
    btn.className = "persona-btn";
    btn.href = p.url;
    btn.target = "_blank";
    btn.innerHTML = '<span class="persona-icon">' + (icons[p.label]||"📄") + '</span><div><div class="persona-label">' + p.label + '</div></div>';
    container.appendChild(btn);
  });
  var gl = document.getElementById("personaGenericLink");
  if (genericUrl) { gl.href = genericUrl; document.getElementById("personaGeneric").style.display = "block"; }
  else { document.getElementById("personaGeneric").style.display = "none"; }
  document.getElementById("personaModal").classList.add("show");
}

function closePersonaModal() { document.getElementById("personaModal").classList.remove("show"); }
</script>
